<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VISMYTH - Login</title>

    <link
        rel="stylesheet"
        href="/static/login/login.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="brand">
                VISMYTH
            </div>

            <p class="brand-subtitle">
                Electronics & More
            </p>


            <!-- ================= LOGIN ================= -->

            <div
                class="auth-section"
                id="loginSection"
            >

                <h1>
                    Welcome back
                </h1>

                <p class="auth-description">
                    Login to continue to your VISMYTH account.
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                        id="loginButton"
                    >
                        Login
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <button
                    type="button"
                    class="google-button"
                    onclick="googleLogin()"
                >

                    <span class="google-icon">
                        G
                    </span>

                    <span>
                        Continue with Google
                    </span>

                </button>


                <div
                    class="message"
                    id="loginMessage"
                ></div>


                <div class="switch-auth">

                    <span>
                        Don't have an account?
                    </span>

                    <button
                        type="button"
                        onclick="showRegister()"
                    >
                        Create Account
                    </button>

                </div>

            </div>


            <!-- ================= REGISTER ================= -->

            <div
                class="auth-section hidden"
                id="registerSection"
            >

                <h1>
                    Create account
                </h1>

                <p class="auth-description">
                    Create your VISMYTH account.
                </p>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="registerName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="registerName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 6 characters"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="registerConfirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="registerConfirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="6"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="primary-button"
                        id="registerButton"
                    >
                        Create Account
                    </button>

                </form>


                <div class="divider">
                    <span>OR</span>
                </div>


                <button
                    type="button"
                    class="google-button"
                    onclick="googleLogin()"
                >

                    <span class="google-icon">
                        G
                    </span>

                    <span>
                        Sign up with Google
                    </span>

                </button>


                <div
                    class="message"
                    id="registerMessage"
                ></div>


                <div class="switch-auth">

                    <span>
                        Already have an account?
                    </span>

                    <button
                        type="button"
                        onclick="showLogin()"
                    >
                        Login
                    </button>

                </div>

            </div>


            <a
                href="/"
                class="back-home"
            >
                Back to VISMYTH
            </a>

        </section>

    </main>


    <script src="/static/login/login.js"></script>

</body>

</html>
